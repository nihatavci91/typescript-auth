services:
  mysql:
    image: mysql:8.4
    container_name: ts-auth-mysql
    restart: unless-stopped

    env_file:
      - .env.docker

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    ports:
      # Bilgisayardan MySQL'e localhost:3307 ile bağlanılır.
      # Container'lar kendi aralarında mysql:3306 kullanır.
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ts-auth-api
    restart: unless-stopped

    env_file:
      - .env.docker

    # Geliştirme veritabanı şemasını eşitle ve sunucuyu başlat.
    command: >
      sh -c "npx prisma generate &&
             npx prisma db push &&
             npm run dev"

    ports:
      - "3000:3000"

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      # WebStorm'da yaptığın değişiklikler container'a yansır.
      - .:/app

      # Windows'taki node_modules ile Linux container node_modules'u karışmasın.
      - node_modules:/app/node_modules

volumes:
  mysql_data:
  node_modules:
